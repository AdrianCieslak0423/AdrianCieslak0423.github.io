# feature for the data you need to update frequently.

# Main Page Setup

title: Adrian Cieslak Portfolio



# Hero Section
name: Adrian Cieslak
headline: Future Mechanical Engineer
description: >- # dont remove this line. this will ignore all new lines until the next section
  Mechanical engineering student with hands-on experience in percision CNC machining, automation analysis, and process improvment at an aerospace manufacturer, as well as extensive CAD and FEA experience. Six Sigma certified with proficiency in SolidWorks, Siemens NX and FEA.

# Place your profile image in /assets/images/profile-image/folder and edit the file name
